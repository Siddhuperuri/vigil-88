# Manual only. Fails while any owner decision in release/decisions.yaml is unresolved (docs/RELEASE.md).
name: release-gate
on:
  workflow_dispatch:

jobs:
  decisions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Every release decision is made and has its evidence
        run: uv run python scripts/release_check.py --release
