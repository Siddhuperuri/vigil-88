# VIGIL-88 committed defaults. No secrets, no absolute paths.
# Machine-specific overrides go in config/vigil.local.yaml (gitignored).
# Environment overrides: VIGIL_<SECTION>__<KEY>=value  (e.g. VIGIL_VISION__MAX_BATCH_SIZE=2)
# Every key is documented in docs/CONFIG.md (generated by `vigil doctor --dump-config`).
version: 1

paths:
  data_dir: ./var # relative paths resolve against the directory containing config/

logging:
  level: INFO
  console_format: auto
  rotate_mb: 64
  retain_files: 10

vision:
  backend: "null" # P0 default. Real backends arrive in P1.
  device: auto
  precision: auto

modules:
  enabled: [] # explicit allowlist; nothing auto-enables

api:
  bind_host: 127.0.0.1
  auth:
    enabled: false
    token: ${env:VIGIL_API_TOKEN:-}

# One camera per file under config/cameras/. Adding a camera is adding a file.
cameras:
  - $include: cameras/*.yaml
