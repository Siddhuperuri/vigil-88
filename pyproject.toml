[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vigil-88"
version = "0.1.0"
description = "VIGIL-88: real-time computer-vision incident detection and situational awareness (P0 foundation)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "structlog>=24.4",
    "typer>=0.12",
    "rich>=13.8",
    "pyyaml>=6.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
# Webcam / image capture. Deliberately separate from the future `vision` extra so that
# capturing frames never requires torch (see docs/adr/0011).
capture = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10",
]
# Detector backends. The CPU and GPU builds of onnxruntime both provide the `onnxruntime`
# module and cannot coexist, so they are conflicting extras (see [tool.uv] below).
# The inference stack is pinned exactly (03 §1 rule 3): a silent minor bump can change
# kernel selection, numerics and VRAM behaviour. The GPU build's CUDA libraries come from
# pip wheels (extras `cuda`, `cudnn`), so no CUDA toolkit install is needed.
onnx-cpu = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10",
    "onnxruntime==1.26.0",
]
onnx-gpu = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10",
    "onnxruntime-gpu[cuda,cudnn]==1.26.0",
    "nvidia-ml-py>=12",
]
# Live annotated stream and metrics over HTTP (loopback by default).
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
vigil = "vigil.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "types-pyyaml",
    "types-psutil",
    "onnx>=1.17",   # builds tiny real ONNX graphs for backend tests; never shipped
    "httpx>=0.27",  # FastAPI TestClient
]

[tool.uv]
conflicts = [[{ extra = "onnx-cpu" }, { extra = "onnx-gpu" }]]

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# The design docs contain illustrative code blocks; they are not linted or reformatted.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "PT",
    "S",    # bandit: hard-coded passwords, try/except/pass, subprocess
    "BLE",  # blind except
    "PTH",  # pathlib over os.path
    "T20",  # no print() in library code
    "DTZ",  # naive datetimes
    "TID",  # banned imports
]
ignore = ["S101"]  # assert is fine in tests; src is checked by mypy instead

[tool.ruff.lint.per-file-ignores]
# PT018: compound asserts read as one fact and pytest still reports each sub-expression.
# C408: dict(...) kwargs builders keep fixture defaults readable.
"tests/**" = ["S105", "S106", "S108", "S311", "T20", "BLE001", "PT011", "PT018", "C408"]
"scripts/**" = ["T20"]
"src/vigil/cli/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["vigil"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["vigil"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["vigil.core.*", "vigil.domain.*"]
disallow_any_explicit = true  # 01 §12: domain/ and core/ forbid Any

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "onnxruntime", "onnxruntime.*", "onnx", "onnx.*", "pynvml", "nvidia", "nvidia.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --timeout=60"
markers = [
    "slow: long-running tests, excluded from the default gate",
    "webcam: needs a physical webcam; run with --webcam",
    "gpu: needs a working CUDA provider; skipped automatically when there is none",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/vigil"]
branch = true

[tool.coverage.report]
# Lines ending in `...` are protocol/stub declarations, not executable behaviour.
exclude_lines = ['pragma: no cover', 'if TYPE_CHECKING:', '\.\.\.$', 'raise NotImplementedError']

# ---------------------------------------------------------------- import-linter
# Layer contracts from docs/architecture/01 §5 and 02 §5. Only packages that exist are
# listed; each phase adds its engines here. TYPE_CHECKING imports are excluded because
# core/protocols must name domain types in annotations (docs/adr/0011).
[tool.importlinter]
root_package = "vigil"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
    "vigil.cli",
    "vigil.pipeline",
    "vigil.ingest | vigil.vision",
    "vigil.domain",
    "vigil.config : vigil.observability",
    "vigil.core",
]

[[tool.importlinter.contracts]]
name = "domain-purity"
type = "forbidden"
source_modules = ["vigil.domain", "vigil.core"]
forbidden_modules = ["numpy", "cv2", "torch", "pydantic", "sqlalchemy", "structlog", "yaml", "psutil", "typer", "rich"]
